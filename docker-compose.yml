# =============================================================
# AGENTIC FRAUD DECISIONING PLATFORM — Docker Compose
# Phase 1: Kafka (KRaft) + Spark + Redis + Kafka UI
# Phase 2: Weaviate (RAG vector store)
# =============================================================
# Port map:
#   Kafka broker:     9092 (external)
#   Kafka internal:   29092 (inter-container)
#   Kafka controller: 29093 (KRaft)
#   Kafka UI:         8080
#   Spark Master UI:  9090
#   Spark Worker UI:  9091
#   Spark Master:     7077
#   Redis:            6379
#   Weaviate REST:    8090
#   Weaviate gRPC:    50051 (required by weaviate-client v4)
# =============================================================

networks:
  fraud-net:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  spark_data:
  weaviate_data:

services:

  # -----------------------------------------------------------
  # KAFKA (KRaft — no Zookeeper)
  # PLAINTEXT     → external clients on host (localhost:9092)
  # PLAINTEXT_INTERNAL → inter-container comms (kafka:29092)
  # CONTROLLER    → KRaft metadata (kafka:29093)
  # user_id as message key → all events per user to same partition
  # 12 partitions = 12 parallel Spark tasks (bumped from 3 — at
  # 10,000 users, more partitions show real parallel consumption)
  # retention 7 days — Snowflake is the audit system of record
  # -----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: fraud-kafka
    hostname: kafka
    networks:
      - fraud-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 604800000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------
  # KAFKA UI — verify transactions flowing before Spark work
  # Uses PLAINTEXT_INTERNAL to reach Kafka inside the network
  # -----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fraud-kafka-ui
    networks:
      - fraud-net
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # -----------------------------------------------------------
  # SPARK MASTER
  # apache/spark:3.5.0 with explicit spark-class command
  # Same pattern as Market Pulse — proven working
  # UI remapped to 9090 (8080 taken by Kafka UI)
  # -----------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.0
    container_name: fraud-spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - fraud-net
    ports:
      - "9090:8080"
      - "7077:7077"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    volumes:
      - ./fraud_platform/stream_processing:/opt/spark-apps/stream_processing
      - ./fraud_platform/feature_store:/opt/spark-apps/feature_store
      - spark_data:/tmp/spark-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5

  # -----------------------------------------------------------
  # SPARK WORKER
  # 4g memory, 2 cores — deliberately constrained relative to
  # 12 partitions and 10M-row backfill so shuffle spill actually
  # happens; this is the point, not a problem to fix
  # Waits for master healthcheck before starting
  # -----------------------------------------------------------
  spark-worker:
    image: apache/spark:3.5.0
    container_name: fraud-spark-worker
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - fraud-net
    ports:
      - "9091:8081"
    environment:
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
    volumes:
      - ./fraud_platform/stream_processing:/opt/spark-apps/stream_processing
      - ./fraud_platform/feature_store:/opt/spark-apps/feature_store
      - spark_data:/tmp/spark-data
    depends_on:
      spark-master:
        condition: service_healthy

  # -----------------------------------------------------------
  # REDIS — Online Feature Store
  # allkeys-lru: evicts stale user features automatically
  # when 512mb limit hit — no manual cleanup needed
  # Key pattern: user:{user_id}:features → JSON blob
  # -----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: fraud-redis
    hostname: redis
    networks:
      - fraud-net
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # WEAVIATE — Vector store for fraud policy docs (Phase 2)
  #
  # DEFAULT_VECTORIZER_MODULE: 'none' — deliberate choice. We
  # embed text ourselves in Python (all-MiniLM-L6-v2, same model
  # as prior RAG project) and upload vectors directly, rather
  # than letting Weaviate call an external embedding API. This
  # keeps embedding logic in one place we control and test, and
  # means Weaviate needs zero internet access or API keys to run.
  #
  # Hybrid search (BM25 + vector) is NATIVE to Weaviate — it
  # doesn't need a module or extra config to use it, unlike
  # Pinecone where sparse/dense score balancing is manual.
  #
  # gRPC port (50051) is required by the v4 Python client even
  # though most operations still go over REST (8090 here, since
  # 8080 is already taken by Kafka UI).
  # -----------------------------------------------------------
  weaviate:
    image: semitechnologies/weaviate:1.25.4
    container_name: fraud-weaviate
    hostname: weaviate
    networks:
      - fraud-net
    ports:
      - "8090:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s