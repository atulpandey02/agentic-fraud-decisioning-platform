# =============================================================
# fraud-platform — installable package (Priority 3)
# =============================================================
# Replaces the run-from-inside-each-directory layout (which forced
# the sys.path inserts and the per-phase `config` module-name
# collision) with one real, importable package: `fraud_platform`.
# Everything is now `from fraud_platform.<area>.<module> import ...`.
#
# Dependency GROUPS mirror the phased install the requirements-*.txt
# files established, but as optional-dependencies so `pip install`
# resolves them together and `pip check` can verify the whole set.
# Exact pins are kept (the langchain/langgraph/protobuf/grpc pins
# were each hard-won); constraints.txt is the full locked resolution.
# =============================================================

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-platform"
version = "0.1.0"
description = "Agentic fraud decisioning platform — streaming features, RAG, multi-agent decisions, governance, BI."
requires-python = ">=3.10"

# Core — Phase 1 streaming/feature/data-generation runtime.
dependencies = [
    "python-dotenv==1.0.0",
    "pydantic>=2.7,<3",
    "faker==24.0.0",
    "confluent-kafka==2.4.0",
    "snowflake-connector-python==3.7.0",
    "redis==5.0.1",
    "pyspark==3.5.0",
    "boto3==1.34.100",
    "pyarrow==15.0.2",
]

[project.optional-dependencies]
# Phase 2 retrieval/RAG. grpc pins REQUIRED so weaviate's grpc import
# survives alongside the BI extras (protobuf<5) — see requirements-rag.txt.
rag = [
    "weaviate-client==4.9.6",
    "sentence-transformers==3.3.1",
    "grpcio-health-checking==1.62.3",
    "grpcio-tools==1.62.3",
]
# Phase 3+ agents. langchain-core bound documented in requirements_agents.txt.
agents = [
    "langgraph==1.0.10",
    "langchain-core>=0.3,<0.4",
    "langchain-groq>=0.3,<0.4",
    "langsmith",
]
# Phase 7 BI. sqlglot is the NL2SQL security guardrail's parser.
bi = [
    "streamlit==1.32.0",
    "plotly==5.20.0",
    "sqlglot==25.34.0",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[project.scripts]
# One documented entry point for the migration runner (Priority 2/3).
fraud-migrate = "fraud_platform.db.migrate:main"

[tool.setuptools.packages.find]
include = ["fraud_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Scoped to real-bug rules (F: undefined names, unused imports,
# f-string/format mistakes) rather than style — the codebase's dense
# design-rationale docstrings and comments would drown a full style
# ruleset in E501 noise without catching anything that matters. CI
# runs exactly this.
line-length = 120

[tool.ruff.lint]
select = ["F"]
